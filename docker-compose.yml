services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nestmanager-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - nestmanager-network

  nginx:
    image: nginx:alpine
    container_name: nestmanager-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nestmanager-network

  redis:
    image: redis:alpine
    container_name: nestmanager-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nestmanager-network

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: nestmanager-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - nestmanager-network

networks:
  nestmanager-network:
    driver: bridge

volumes:
  redis_data:
